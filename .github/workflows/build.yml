# Checks and builds the app on every push. Each push to main replaces the "nightly"
# release, so the latest build is always at the same address:
# https://github.com/<owner>/<repo>/releases/download/nightly/reading-stats-<platform>.zip
# A push to main with a version in build.zig.zon that has no release yet publishes it;
# so does a tag v<version> matching it.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.0

permissions:
  contents: write

# Two pushes in a row must not replace the nightly release at the same time
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-$(uname -m)-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Decide the kind of build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^ *\.version = "\(.*\)",.*/\1/p' build.zig.zon)"
          # The app compares these with what is published when it looks for an update
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            kind=release; tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            # A version of build.zig.zon that has no release yet is released by this push,
            # the next pushes make nightly builds again
            if gh release view "v$version" > /dev/null 2>&1; then
              kind=nightly; tag=nightly
            else
              kind=release; tag="v$version"
            fi
          else
            kind=dev; tag=
          fi
          {
            echo "KIND=$kind"
            echo "RELEASE_TAG=$tag"
            echo "APP_VERSION=$version"
            echo "ZIGFLAGS=-Dchannel=$kind -Dcommit=$GITHUB_SHA -Dupdate-repo=$GITHUB_REPOSITORY"
          } >> "$GITHUB_ENV"

      - name: Check that a release tag matches the version
        if: env.KIND == 'release' && github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $APP_VERSION in build.zig.zon"
            exit 1
          fi

      - name: Format
        run: make fmt-check

      - name: Tests
        run: make test

      - name: Build
        run: make build-all ZIGFLAGS="$ZIGFLAGS"

      - name: Build for debugging
        run: |
          # Debug builds write a log, see "Debugging" in the README
          for platform in allwinner rk3566; do
            zig build -Dplatform=$platform $ZIGFLAGS --prefix zig-out/debug-$platform
            mv "zig-out/debug-$platform/bin/Reading Stats.app" "zig-out/debug-$platform/bin/Reading Stats.bin"
            cp scripts/stats-debug.app zig-out/debug-$platform/bin/
          done

      - name: Package
        run: |
          mkdir -p dist
          for platform in allwinner rk3566; do
            (cd zig-out/$platform/bin && zip -9 "$GITHUB_WORKSPACE/dist/reading-stats-$platform.zip" "Reading Stats.app")
            (cd zig-out/debug-$platform/bin && zip -9 "$GITHUB_WORKSPACE/dist/reading-stats-$platform-debug.zip" "Reading Stats.bin" stats-debug.app)
            # Unzipped, for the app to update itself. GitHub refuses files ending in .app
            cp "zig-out/$platform/bin/Reading Stats.app" "dist/reading-stats-$platform.bin"
          done
          {
            echo "channel=$KIND"
            echo "version=$APP_VERSION"
            echo "commit=$GITHUB_SHA"
            echo "tag=$RELEASE_TAG"
            echo "date=$(date -u +%Y-%m-%d)"
          } > dist/version.txt
          cat dist/version.txt
          ls -la dist

      - name: Keep the files of this run
        uses: actions/upload-artifact@v4
        with:
          name: reading-stats-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish as nightly release
        if: env.KIND == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes "Latest build of main, commit ${GITHUB_SHA::7}. Unzip and copy \`Reading Stats.app\` into the \`applications\` folder of your PocketBook."

      - name: Publish the release
        if: env.KIND == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Version ${APP_VERSION}. Unzip and copy \`Reading Stats.app\` into the \`applications\` folder of your PocketBook."
